functions:
  current_datetime:
    _type: current_datetime
  aurora_director:
    _type: aurora_director
    prefix: "Hello:"

llms:
  nim_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    temperature: 0.0
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: react_agent
  llm_name: nim_llm
  tool_names: [current_datetime, aurora_director]
