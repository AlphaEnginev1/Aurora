[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "mcp>=2,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aurora*"]
exclude = ["config*", "deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that call external live providers",
]
