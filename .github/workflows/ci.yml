name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests --ignore=tests/e2e

  e2e-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap slirp4netns nftables iproute2 util-linux curl ca-certificates
      - name: Enable unprivileged namespaces for CI
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/e2e

  live-research-discovery:
    if: contains(github.event.head_commit.message, '[live-research-gate]')
    runs-on: ubuntu-latest
    env:
      AURORA_LIVE_RESEARCH_GATE: "1"
      AURORA_RESEARCH_DISCOVERY_ENDPOINT: "https://searx.oloke.xyz/search?format=json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run real research discovery gate
        run: python -m pytest -q tests/e2e/test_live_research_discovery.py
