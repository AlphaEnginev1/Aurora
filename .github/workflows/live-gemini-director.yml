name: Live Gemini Director Gate

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Gemini Director model ID"
        required: false
        default: "gemini-3.7-flash"
        type: string
      endpoint:
        description: "Gemini API base endpoint"
        required: false
        default: "https://generativelanguage.googleapis.com/v1beta"
        type: string

jobs:
  live-gemini-director:
    runs-on: ubuntu-24.04
    environment: gemini-live
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Verify LIVE-GEMINI workflow revision
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          grep -q 'GEMINI_API_KEY' tests/e2e/test_live_gemini_director.py
          grep -q 'GEMINI_API_TIMEOUT' aurora/orchestration/gemini_provider.py
          grep -q 'NVIDIA_GEMINI_LIVE: "1"' .github/workflows/live-gemini-director.yml
      - name: Run real Gemini Director gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_ID: ${{ inputs.model_id }}
          GEMINI_API_ENDPOINT: ${{ inputs.endpoint }}
          NVIDIA_GEMINI_LIVE: "1"
          GEMINI_API_TIMEOUT: "120"
        run: python -m pytest -q tests/e2e/test_live_gemini_director.py -m live
