name: Live Director Provider Failover Gate

on:
  workflow_dispatch:
    inputs:
      gemini_model_id:
        description: "Gemini Director model ID"
        required: false
        default: "gemini-3.7-flash"
        type: string
      gemini_endpoint:
        description: "Gemini API base endpoint"
        required: false
        default: "https://generativelanguage.googleapis.com/v1beta"
        type: string
      nvidia_model_id:
        description: "NVIDIA served Director model ID"
        required: true
        type: string
      nvidia_endpoint:
        description: "NVIDIA-compatible /v1 endpoint"
        required: false
        default: "https://integrate.api.nvidia.com/v1"
        type: string

jobs:
  live-director-provider-failover:
    runs-on: ubuntu-latest
    environment: director-provider-failover-live
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Verify Increment 12 live gate revision
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          grep -q 'AURORA_DIRECTOR_PROVIDER_FAILOVER_LIVE' tests/e2e/test_live_director_provider_failover.py
          grep -q 'ForcedGeminiFailure' tests/e2e/test_live_director_provider_failover.py
          grep -q 'nvidia_api' tests/e2e/test_live_director_provider_failover.py
      - name: Run real Gemini -> NVIDIA failover gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_ID: ${{ inputs.gemini_model_id }}
          GEMINI_API_ENDPOINT: ${{ inputs.gemini_endpoint }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL_ID: ${{ inputs.nvidia_model_id }}
          NVIDIA_API_ENDPOINT: ${{ inputs.nvidia_endpoint }}
          AURORA_DIRECTOR_PROVIDER_FAILOVER_LIVE: "1"
          GEMINI_API_TIMEOUT: "120"
          NVIDIA_API_TIMEOUT: "180"
        run: python -m pytest -q tests/e2e/test_live_director_provider_failover.py -m live
