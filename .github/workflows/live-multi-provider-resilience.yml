name: Live Free-Model Resilience Gate

on:
  workflow_dispatch:
    inputs:
      gemini_model_id:
        description: "Optional free Gemini Director model override"
        required: false
        default: "gemini-3.8-flash"
        type: string
      nvidia_model_id:
        description: "Optional free NVIDIA reasoning model override"
        required: false
        type: string
      nvidia_endpoint:
        description: "NVIDIA-compatible /v1 endpoint"
        required: false
        default: "https://integrate.api.nvidia.com/v1"
        type: string

jobs:
  live-free-model-resilience:
    runs-on: ubuntu-24.04
    environment: multi-provider-live
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Verify live gate revision
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          grep -q 'AURORA_MULTI_PROVIDER_LIVE' tests/e2e/test_live_multi_provider_resilience.py
          grep -q 'free_only' tests/e2e/test_live_multi_provider_resilience.py
          grep -q 'ModelEnsemble' tests/e2e/test_live_multi_provider_resilience.py
          grep -q '_run_adversarial_review' tests/e2e/test_live_multi_provider_resilience.py
          grep -q '_build_director_provider_failover' tests/e2e/test_live_multi_provider_resilience.py
          if grep -q 'OPENAI_API_KEY\|ANTHROPIC_API_KEY' tests/e2e/test_live_multi_provider_resilience.py; then
            echo "Paid provider credential dependency detected"
            exit 1
          fi
      - name: Run live free-model resilience acceptance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_ID: ${{ inputs.gemini_model_id }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL_ID: ${{ inputs.nvidia_model_id }}
          NVIDIA_API_ENDPOINT: ${{ inputs.nvidia_endpoint }}
          AURORA_MULTI_PROVIDER_LIVE: "1"
          AURORA_INFERENCE_COST_POLICY: "free_only"
          AURORA_FREE_MODEL_POLICY: "config/free-model-policy.json"
          AURORA_PROVIDER_HEALTH_FAILURE_THRESHOLD: "1"
          AURORA_MODEL_DISCOVERY_REFRESH_SECONDS: "0"
          GEMINI_API_TIMEOUT: "90"
          NVIDIA_API_TIMEOUT: "120"
        run: python -m pytest -q tests/e2e/test_live_multi_provider_resilience.py -m live
