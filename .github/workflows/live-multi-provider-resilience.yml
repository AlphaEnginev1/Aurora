name: Live NVIDIA Free-Model Gate

on:
  workflow_dispatch:
    inputs:
      nvidia_model_id:
        description: "Optional NVIDIA reasoning model override"
        required: false
        type: string
      nvidia_endpoint:
        description: "NVIDIA-compatible /v1 endpoint"
        required: false
        default: "https://integrate.api.nvidia.com/v1"
        type: string


jobs:
  live-nvidia-only:
    # Real NVIDIA inference consumes a provider request. Only explicit manual runs may do this.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    # Reuse the GitHub Actions environment from the last confirmed real NVIDIA inference.
    environment: director-provider-failover-live
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Verify NVIDIA-only gate revision
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          grep -q 'AURORA_NVIDIA_ONLY_LIVE' tests/e2e/test_live_multi_provider_resilience.py
          grep -q 'free_only' tests/e2e/test_live_multi_provider_resilience.py
          if grep -q 'GEMINI_API_KEY\|OPENAI_API_KEY\|ANTHROPIC_API_KEY' tests/e2e/test_live_multi_provider_resilience.py; then
            echo "Removed provider dependency detected"
            exit 1
          fi
      - name: Run live NVIDIA-only acceptance
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL_ID: ${{ inputs.nvidia_model_id }}
          NVIDIA_API_ENDPOINT: ${{ inputs.nvidia_endpoint }}
          AURORA_NVIDIA_ONLY_LIVE: "1"
          AURORA_INFERENCE_COST_POLICY: "free_only"
          AURORA_FREE_MODEL_POLICY: "config/free-model-policy.json"
        run: python -m pytest -q -s tests/e2e/test_live_multi_provider_resilience.py -m live
