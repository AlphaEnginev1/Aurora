name: Live NVIDIA Learning Gate

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "NVIDIA served model ID"
        required: true
        type: string
      endpoint:
        description: "NVIDIA-compatible /v1 endpoint"
        required: false
        default: "https://integrate.api.nvidia.com/v1"
        type: string

jobs:
  live-nvidia-learning:
    runs-on: ubuntu-latest
    environment: nvidia-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run live provider adaptive-learning gate
        env:
          AURORA_LIVE_NVIDIA_GATE: "1"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL_ID: ${{ inputs.model_id }}
          NVIDIA_API_ENDPOINT: ${{ inputs.endpoint }}
          NVIDIA_API_TIMEOUT: "180"
        run: python -m pytest -q tests/e2e/test_live_nvidia_learning.py
