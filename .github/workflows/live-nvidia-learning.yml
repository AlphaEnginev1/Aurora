name: Live NVIDIA Learning Gate

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "NVIDIA served model ID"
        required: true
        type: string
      endpoint:
        description: "NVIDIA-compatible /v1 endpoint"
        required: false
        default: "https://integrate.api.nvidia.com/v1"
        type: string

jobs:
  live-nvidia-learning:
    runs-on: ubuntu-24.04
    environment: nvidia-live
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Verify LIVE-NVIDIA workflow revision
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          grep -q 'AURORA_LIVE_NVIDIA_GATE: "1"' .github/workflows/live-nvidia-learning.yml
          grep -q 'NVIDIA_API_TIMEOUT: "180"' .github/workflows/live-nvidia-learning.yml
          grep -q 'provider_options' tests/e2e/test_live_nvidia_learning.py
          grep -q 'reasoning_effort' tests/e2e/test_live_nvidia_learning.py
          grep -q 'provider_options' aurora/inference/providers/nvidia_api.py
      - name: Run live provider adaptive-learning gate
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL_ID: ${{ inputs.model_id }}
          NVIDIA_API_ENDPOINT: ${{ inputs.endpoint }}
          NVIDIA_API_TIMEOUT: "180"
          AURORA_LIVE_NVIDIA_GATE: "1"
        run: python -m pytest -q tests/e2e/test_live_nvidia_learning.py
