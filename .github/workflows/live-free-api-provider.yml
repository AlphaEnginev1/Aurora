name: Live OpenRouter Free Inference

on:
  pull_request:
    paths:
      - ".github/workflows/live-free-api-provider.yml"
      - "aurora/inference/providers/**"
      - "aurora/orchestration/factory.py"
      - "config/free-model-policy.json"
      - "config/network-policy.json"
      - "tests/e2e/test_live_openrouter_inference.py"
      - "tests/test_openrouter_network_policy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-openrouter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run real OpenRouter free inference
        env:
          AURORA_OPENROUTER_LIVE: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AURORA_INFERENCE_COST_POLICY: "free_only"
          AURORA_FREE_MODEL_POLICY: "config/free-model-policy.json"
        run: python -m pytest -q -s tests/e2e/test_live_openrouter_inference.py -m live
