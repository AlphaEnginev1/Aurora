name: Validate Task 2 artifacts

on:
  push:
    branches:
      - "validation/task2-artifacts"

permissions:
  contents: read

jobs:
  validate-task2-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artifact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify ZIP integrity and safe paths
        run: |
          python -m zipfile -t Aurora-main-fase1-tarea2.zip
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "Aurora-main-fase1-tarea2.zip"
          with ZipFile(archive) as zf:
              names = zf.namelist()
              assert names, "Task 2 ZIP is empty"
              unsafe = [n for n in names if PurePosixPath(n).is_absolute() or ".." in PurePosixPath(n).parts]
              assert not unsafe, f"Unsafe ZIP paths: {unsafe[:10]}"
              matches = [n for n in names if n.endswith("aurora/failure_tracker.py")]
              assert len(matches) == 1, f"Expected one aurora/failure_tracker.py, found {matches}"
              print(f"ZIP entries: {len(names)}")
              print(f"Source root: {matches[0][:-len('aurora/failure_tracker.py')]}")
          PY
      - name: Apply patch against main and compare changed files with ZIP
        run: |
          git fetch origin main
          git worktree add --detach /tmp/task2-base origin/main
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import re
          import shutil

          archive = Path("Aurora-main-fase1-tarea2.zip")
          patch = Path("aurora-fase1-tarea2.patch")
          extracted = Path("/tmp/task2-zip")
          extracted.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as zf:
              names = zf.namelist()
              matches = [n for n in names if n.endswith("aurora/failure_tracker.py")]
              assert len(matches) == 1, f"Expected one source root: {matches}"
              root = matches[0][:-len("aurora/failure_tracker.py")]
              zf.extractall(extracted)
          targets = []
          for line in patch.read_text(encoding="utf-8").splitlines():
              if line.startswith("+++ b/"):
                  path = line[6:].split("\\t", 1)[0].split("\t", 1)[0].split("  ", 1)[0].strip()
                  if path != "/dev/null":
                      targets.append(path)
          targets = list(dict.fromkeys(targets))
          assert targets, "No target files found in patch"
          print(f"Patch target files: {len(targets)}")
          print(f"ZIP root prefix: {root!r}")
          (Path("/tmp") / "task2-targets.txt").write_text("\n".join(targets), encoding="utf-8")
          (Path("/tmp") / "task2-zip-root.txt").write_text(root, encoding="utf-8")
          PY
          git -C /tmp/task2-base apply --check "$GITHUB_WORKSPACE/aurora-fase1-tarea2.patch"
          git -C /tmp/task2-base apply "$GITHUB_WORKSPACE/aurora-fase1-tarea2.patch"
          python - <<'PY'
          from pathlib import Path
          import difflib
          targets = Path("/tmp/task2-targets.txt").read_text(encoding="utf-8").splitlines()
          root = Path("/tmp/task2-zip-root.txt").read_text(encoding="utf-8")
          archive_root = Path("/tmp/task2-zip") / root
          base = Path("/tmp/task2-base")
          mismatches = []
          for rel in targets:
              patched = base / rel
              archived = archive_root / rel
              if not patched.is_file() or not archived.is_file():
                  mismatches.append(f"{rel}: missing patched={patched.is_file()} zip={archived.is_file()}")
              elif patched.read_bytes() != archived.read_bytes():
                  mismatches.append(f"{rel}: contents differ between patch result and ZIP")
                  try:
                      diff = difflib.unified_diff(
                          patched.read_text(encoding="utf-8", errors="replace").splitlines(),
                          archived.read_text(encoding="utf-8", errors="replace").splitlines(),
                          fromfile=f"patch-result/{rel}",
                          tofile=f"zip/{rel}",
                          lineterm="",
                      )
                      print("\\n".join(list(diff)[:160]))
                  except Exception as exc:
                      print(f"Could not render diff for {rel}: {type(exc).__name__}")
          if mismatches:
              print("::warning::ZIP and patch differ; see details below. Tests will run against the patch applied to main.")
              print("\\n".join(mismatches))
          else:
              print(f"ZIP and patch agree on all {len(targets)} changed files")
          PY
      - name: Install project and test Task 2 patch
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e /tmp/task2-base
          cd /tmp/task2-base
          python -m pytest -q tests/test_failure_visibility.py
          python -m pytest -q tests --ignore=tests/e2e
