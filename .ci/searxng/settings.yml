use_default_settings:
  engines:
    keep_only:
      - aurora-wikipedia

general:
  debug: false
  instance_name: "Aurora Live Research SearXNG"

search:
  safe_search: 0
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  limiter: false
  public_instance: false
  image_proxy: false
  secret_key: "aurora-live-research-ci-secret"

engines:
  - name: aurora-wikipedia
    engine: json_engine
    shortcut: awp
    categories:
      - general
      - web
    disabled: false
    search_url: "https://en.wikipedia.org/w/rest.php/v1/search/page?q={query}&limit=10"
    results_query: pages
    url_query: key
    url_prefix: "https://en.wikipedia.org/wiki/"
    title_query: title
    content_query: excerpt
    timeout: 10
